# safety-kernel-middleware — app-layer FastAPI/Starlette enforcement built on
# the safety-kernel-client PyO3 SDK.
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-kernel-middleware"
version = "0.1.0"
description = "FastAPI/Starlette Safety Kernel enforcement middleware (fail-closed) on the safety-kernel-client SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ARYA Labs PBC" }]
keywords = ["safety-kernel", "fastapi", "starlette", "middleware", "fail-closed", "authorization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# The client SDK carries the real fingerprint + fail-closed authorize path.
dependencies = ["safety-kernel-client>=0.1.0"]

[project.optional-dependencies]
# App-layer framework support. The base install is framework-agnostic; the
# middleware raises a clear error if constructed without starlette present.
fastapi = ["starlette>=0.37"]
test = [
    "pytest>=7.0",
    "starlette>=0.37",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/ARYA-Labs-Public/unfireable-safety-kernel"
Repository = "https://github.com/ARYA-Labs-Public/unfireable-safety-kernel"
Issues = "https://github.com/ARYA-Labs-Public/unfireable-safety-kernel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["safety_kernel_middleware*"]
exclude = ["safety_kernel_middleware.tests*"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
per-file-ignores = { "safety_kernel_middleware/tests/*" = ["B017", "S101", "PLR2004"] }

[tool.ruff.format]
quote-style = "double"
