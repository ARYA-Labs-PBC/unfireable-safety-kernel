# Rust workspace root for Safety Kernel.
#
# Per ADR-014 (Rust + Postgres migration), the codebase migrates business
# logic / RPC / state surfaces from Python to Rust via strangler fig.
# Python remains at python/ai-service/ for AI/ML/science work.
#
# Workspace layout (per agent/boundaries.toml — Jankurai reference profile):
#   crates/domain/        — pure types and traits, NO I/O / network / clock / RNG
#   crates/application/   — use cases that orchestrate the domain
#   crates/adapters/      — HTTP / DB / queue clients (the only place I/O lives)
#   crates/workers/       — background jobs and long-running processes
#   crates/services/      — HTTP service binaries (axum routers, transport setup)
#
# Build:    cargo build --workspace
# Test:     cargo test --workspace
# Lint:     cargo clippy --workspace --all-targets -- -D warnings
# Format:   cargo fmt --all
[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/adapters/safety_kernel_client",
    "crates/adapters/transparency_store",
    "crates/workers",
    "crates/services/safety-kernel",
    "crates/services/safety-kernel-reconciler",
    "crates/services/biotech_nanofold",
    "crates/services/transparency-log",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Proprietary"
repository = "https://github.com/ARYA-Labs-Public/unfireable-safety-kernel"
authors = ["ARYA Labs <eng@aryalabs.io>"]

[workspace.dependencies]
# Promoted here once ≥2 crates pin the same version. Union of Slice 1
# (Safety Kernel, ADR-014 §"First four slices") + Slice 2 (DDI dispatch)
# + Slice 3 (Phase 3c nanofold service) + Slice 4 (Phase 3d atlas runner).
#
# Per ADR-014 Slice 1 §6.2 (`docs/adr/adr-014-slice-1-equivalence.md`):
#   - NO `jsonwebtoken` (custom compact form, not JWT — see §6.3 anti-pin).
#   - NO `serde_json` `preserve_order`: byte stability via `BTreeMap`, not insertion order.
#   - `tracing` / `tracing-subscriber` are NOT for the domain crate
#     (forbidden by `agent/boundaries.toml`); service + adapters only.
#
# Slice 2 (DDI dispatch) shares serde/serde_json/thiserror/sha2/hex/tokio
# and adds nothing the Slice 1 set does not already cover; tokio's feature
# set is the union of all slices' needs.
#
# Slice 3 (Phase 3c biotech_nanofold service) consumes axum/tokio/serde/
# serde_json/tracing/tower already pinned here; it additionally needs the
# `json` feature on tracing-subscriber (structured service logs) — folded
# into the union below. tokio's Slice-1 feature set already covers Slice 3's
# needs (net/process/signal/io-util/time), so no tokio change is required.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "io-util", "process", "fs", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
# Union: Slice 1 needs ["env-filter", "fmt"]; Slice 3 (nanofold service)
# needs "json" for structured service logs. Superset kept here.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
bytes = "1"
# Slice 2 SK-client integration (internal-ref MED-2 remediation): reqwest
# is the DDI dispatcher's HTTP client for POST /kernel/v1/authorize.
# Forbidden in the domain crate per `agent/boundaries.toml`; lives in
# adapters only. `rustls-tls` (not native-tls) so we don't pull
# OpenSSL — matches the SK service's own TLS choice.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# internal-ref Phase 3 Step 2: pinned at the workspace level so the
# transparency-log service and the future
# `crates/adapters/transparency_store/` agree on the version + feature
# set. `runtime-tokio` (NOT runtime-tokio-rustls / runtime-tokio-native-tls)
# — we connect to Postgres without TLS in dev and add the TLS layer at
# the adapter boundary if/when prod needs it. Explicitly no
# `aws-lc-rs` feature anywhere (internal-ref ban). `default-features = false`
# so we don't accidentally pull in the older v0.7 macro engine.
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "macros", "chrono"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
# Faster iteration; debug info on. Trade-off: larger binaries (we don't ship dev).
debug = true
incremental = true
