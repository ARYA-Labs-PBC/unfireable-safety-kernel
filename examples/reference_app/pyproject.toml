[project]
name = "qorch-safety-reference-app"
version = "0.1.0"
description = "  reference FastAPI app demonstrating Safety Kernel wiring."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34",
    "httpx>=0.28",
    "cryptography>=44.0.1",
    "prometheus-client>=0.21",
    # The two-line in-tree dependency. In a public repo cut
    # these become path-or-version deps on published wheels.
    # "qorch-safety-client @ file://../../packages/safety/client",
    # "qorch-domain @ file://../../packages/core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
